name: Release Packages & APT Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave empty to auto-increment build number on v1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            DEB_VER="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            DEB_VER="${{ github.event.inputs.version }}"
            TAG="v${DEB_VER}"
          else
            DEB_VER="1.0.${{ github.run_number }}"
            TAG="v${DEB_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "deb_ver=${DEB_VER}" >> "$GITHUB_OUTPUT"

      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config dpkg-dev apt-utils appstream appstream-compose

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb package
        run: |
          cargo deb --deb-version "${{ steps.meta.outputs.deb_ver }}"
          cp target/debian/cosmic-applet-moon_*_amd64.deb target/debian/cosmic-applet-moon_amd64.deb

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: target/debian/*.deb

      - name: Prepare APT & AppStream repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          mkdir -p apt-repo/pool/main
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          mkdir -p apt-repo/dists/stable/main/dep11
          mkdir -p pkg-extract

          # Copy only the versioned .deb into pool/main
          cp target/debian/cosmic-applet-moon_${{ steps.meta.outputs.deb_ver }}*_amd64.deb apt-repo/pool/main/

          # Export public GPG key for users
          gpg --armor --export "$GPG_KEY_ID" > apt-repo/public.gpg

          # Extract .deb contents so appstreamcli can compose COSMIC Store YAML catalog & icons
          dpkg-deb -x apt-repo/pool/main/*.deb pkg-extract/
          mkdir -p appstream-out
          appstreamcli compose \
            --origin=cosmic-applet-moon \
            --components=io.github.gavril.amarant.CosmicAppletMoon \
            --result-root=appstream-out \
            pkg-extract/

          ls -laR appstream-out/

          # Convert generated YAML catalog (.yml.xz or .yml.gz) into Components-amd64.yml.gz
          YML_XZ=$(find appstream-out -name "*.yml.xz" | head -n1)
          YML_GZ=$(find appstream-out -name "*.yml.gz" | head -n1)
          if [ -n "$YML_XZ" ]; then
            xz -dc "$YML_XZ" | gzip -9 > apt-repo/dists/stable/main/dep11/Components-amd64.yml.gz
          elif [ -n "$YML_GZ" ]; then
            cp -f "$YML_GZ" apt-repo/dists/stable/main/dep11/Components-amd64.yml.gz
          fi

          # Package composed icons into icons-128x128.tar.gz
          ICON_TAR=$(find appstream-out -name "*128x128*.tar.gz" | head -n1)
          if [ -n "$ICON_TAR" ]; then
            cp -f "$ICON_TAR" apt-repo/dists/stable/main/dep11/icons-128x128.tar.gz
          else
            mkdir -p appstream-out/icons/128x128
            cp pkg-extract/usr/share/icons/hicolor/128x128/apps/io.github.gavril.amarant.CosmicAppletMoon.png appstream-out/icons/128x128/
            tar -czf apt-repo/dists/stable/main/dep11/icons-128x128.tar.gz -C appstream-out/icons/128x128 .
          fi

          # Generate Packages & Packages.gz
          cd apt-repo
          dpkg-scanpackages --arch amd64 pool/main > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # Generate signed Release & InRelease
          cat <<EOF > dists/stable/Release
          Origin: cosmic-applet-moon
          Label: cosmic-applet-moon
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: APT Repository for COSMIC Moon Phase & Sun Times Applet
          EOF
          apt-ftparchive release dists/stable >> dists/stable/Release

          gpg --batch --yes --default-key "$GPG_KEY_ID" -abs -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o dists/stable/InRelease dists/stable/Release

          # Simple landing page
          cat <<EOF > index.html
          <!doctype html>
          <html><body>
          <h1>Moon Phase for COSMIC DE APT Repository</h1>
          <p>See <a href="https://github.com/gavril-amarant/cosmic-applet-moon?tab=readme-ov-file#readme-ov-file">Moon Phase Homepage</a> for installation instructions.</p>
          </body></html>
          EOF

      - name: Deploy APT repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
