[package]
homepage = "https://github.com/gavril-amarant/cosmic-applet-moon?tab=readme-ov-file#readme-ov-file"
name = "cosmic-applet-moon"
version = "1.0.0"
edition = "2024"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["applet", "tokio", "wayland"] }
chrono = "0.4"   
serde = "1.0.229"
iana-time-zone = "0.1"
chrono-tz = "0.10"
zbus = { version = "6.2", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ron = "0.12.3"


[package.metadata.deb]
maintainer = "Gavril Amarant"
copyright = "2026, Gavril Amarant"
license-file = ["LICENSE", "0"]
extended-description = """\
A lightweight, 100% offline panel applet for the COSMIC Desktop Environment \
that displays lunar phases, illumination, and local moon/sun rise and set times."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/cosmic-applet-moon", "usr/bin/", "755"],
    ["assets/io.github.gavril_amarant.cosmic-applet-moon.desktop", "usr/share/applications/", "644"],
    ["assets/io.github.gavril_amarant.cosmic-applet-moon.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icons/app-icon-128.png", "usr/share/icons/hicolor/128x128/apps/io.github.gavril_amarant.cosmic-applet-moon.png", "644"],
]



